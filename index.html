<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SBE3 VS CHARLOMANTI - KOMBAT ARENA</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Permanent+Marker&family=Orbitron:wght@700;900&display=swap');

    body {
      background-color: #050508;
      font-family: 'Cinzel', serif;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    .mk-title {
      font-family: 'Cinzel', serif;
      text-shadow: 0 0 20px #ef4444, 0 0 40px #b91c1c, 0 4px 0 #7f1d1d;
    }

    .arcade-font {
      font-family: 'Orbitron', monospace;
    }

    .fatality-font {
      font-family: 'Permanent Marker', cursive;
      text-shadow: 0 0 30px #dc2626, 0 0 60px #991b1b, 0 5px 0 #450a0a;
    }

    /* Screen Shake Animation */
    @keyframes mkShake {
      0% { transform: translate(0, 0) scale(1); }
      20% { transform: translate(-10px, 8px) scale(1.02); }
      40% { transform: translate(10px, -8px) scale(1.01); }
      60% { transform: translate(-6px, 4px) scale(1.02); }
      80% { transform: translate(6px, -4px) scale(1.01); }
      100% { transform: translate(0, 0) scale(1); }
    }
    .shake-impact {
      animation: mkShake 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* Blood Drips */
    @keyframes bloodDrip {
      0% { transform: translateY(-100%); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(120%); opacity: 0; }
    }

    /* Floating Hit Damage Numbers */
    @keyframes hitFloat {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      30% { transform: translateY(-25px) scale(1.4); }
      100% { opacity: 0; transform: translateY(-55px) scale(1); }
    }
    .floating-dmg {
      animation: hitFloat 0.75s forwards ease-out;
      pointer-events: none;
    }

    /* Glow Pulses */
    @keyframes altEgoRage {
      0%, 100% { filter: drop-shadow(0 0 15px #a855f7) drop-shadow(0 0 30px #ec4899); }
      50% { filter: drop-shadow(0 0 35px #c084fc) drop-shadow(0 0 60px #f43f5e); }
    }
    .alt-ego-flame {
      animation: altEgoRage 0.8s infinite alternate;
    }

    canvas {
      image-rendering: pixelated;
    }
  </style>
</head>

  <!-- SCRIPT: AUDIO SYNTHESIZER & MORTAL KOMBAT GAME ENGINE -->
  <script>
    // ==========================================
    // 1. PROCEDURAL SOUND SYNTHESIZER (MK STYLE)
    // ==========================================
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      const status = document.getElementById('soundStatus');
      status.textContent = soundEnabled ? 'ON' : 'OFF';
      status.className = soundEnabled ? 'text-green-400' : 'text-red-400';
      if (soundEnabled) speakAnnouncer('Mortal Kombat!');
    }

    // Voice Announcer using SpeechSynthesis (if supported) + fallback synth
    function speakAnnouncer(text) {
      if (!soundEnabled) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.pitch = 0.55; // Deep demon/announcer voice
        utter.rate = 0.95;
        utter.volume = 1;
        window.speechSynthesis.speak(utter);
      }
      // Add heavy synthesized sub-gong
      playGong(85, 0.8);
    }

    function playGong(freq, duration) {
      if (!soundEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playPunchSFX() {
      if (!soundEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    function playHeavyHitSFX() {
      if (!soundEnabled) return;
      initAudio();
      try {
        // Crunch / Bone snap frequency pair
        [90, 160].forEach((f, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = idx === 0 ? 'square' : 'sawtooth';
          osc.frequency.setValueAtTime(f, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        });
      } catch (e) {}
    }

    function playLawDocSweepSFX() {
      if (!soundEnabled) return;
      initAudio();
      try {
        // 3 rapid swooshing snaps
        [0, 80, 160].forEach((delay, i) => {
          setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(450 - (i * 60), audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.09);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.09);
          }, delay);
        });
      } catch (e) {}
    }

    function playAltEgoRoarSFX() {
      if (!soundEnabled) return;
      initAudio();
      try {
        [100, 140, 220].forEach((f) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(f * 1.6, audioCtx.currentTime + 0.3);
          osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.7);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.7);
        });
      } catch (e) {}
    }

    function playCharismaUltSFX() {
      if (!soundEnabled) return;
      initAudio();
      try {
        [440, 554, 659, 880, 1108].forEach((f, i) => {
          setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
          }, i * 70);
        });
        setTimeout(() => playHeavyHitSFX(), 400);
      } catch (e) {}
    }

    // ==========================================
    // 2. MORTAL KOMBAT 2D CANVAS ENGINE
    // ==========================================
    const canvas = document.getElementById('mkCanvas');
    const ctx = canvas.getContext('2d');

    // Particle system (Blood, Hit Sparks, Fiery Embers, Charisma Rays)
    const particles = [];
    class Particle {
      constructor(x, y, vx, vy, color, size, life, isBlood = false) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.size = size;
        this.life = life;
        this.maxLife = life;
        this.isBlood = isBlood;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.isBlood) {
          this.vy += 0.45; // Gravity
          if (this.y > 450) {
            this.y = 450;
            this.vx = 0;
            this.vy = 0;
          }
        } else {
          this.vy += 0.15;
        }
        this.life--;
      }
      draw(c) {
        c.save();
        c.globalAlpha = Math.max(0, this.life / this.maxLife);
        c.fillStyle = this.color;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    function spawnHitSparks(x, y, color = '#facc15', count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 7;
        particles.push(new Particle(
          x, y,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed,
          color,
          2 + Math.random() * 3,
          15 + Math.random() * 15
        ));
      }
    }

    function spawnBlood(x, y, count = 20) {
      for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
        const speed = 3 + Math.random() * 8;
        particles.push(new Particle(
          x, y,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed,
          Math.random() > 0.3 ? '#dc2626' : '#7f1d1d',
          2 + Math.random() * 3.5,
          35 + Math.random() * 30,
          true
        ));
      }
    }

    // Fighter Class
    class Fighter {
      constructor(id, name, x, y, facing, colorTheme) {
        this.id = id;
        this.name = name;
        this.x = x;
        this.y = y;
        this.baseY = 440;
        this.vx = 0;
        this.vy = 0;
        this.facing = facing; // 1 = facing right, -1 = facing left
        this.colorTheme = colorTheme;

        // Stats
        this.hp = 100;
        this.maxHp = 100;
        this.superGauge = 20;
        this.roundWins = 0;

        // States
        this.state = 'idle'; // idle, walk, jump, crouch, punch, kick, ult, hurt, knockdown, dead
        this.stateTimer = 0;
        this.isGrounded = true;
        this.isBlocking = false;

        // Sbe3 specifics
        this.altEgo = false;
        this.altEgoTimer = 0;

        // Charlomanti specifics
        this.camo = false;
        this.camoTimer = 0;

        // Combo counter
        this.comboCount = 0;
        this.comboDmg = 0;
        this.comboTimer = 0;
      }

      update(opponent) {
        // Horizontal Movement
        this.x += this.vx;
        if (this.x < 80) this.x = 80;
        if (this.x > 880) this.x = 880;

        // Vertical Movement (Gravity & Jumping)
        this.y += this.vy;
        if (this.y < this.baseY) {
          this.vy += 0.95; // gravity
          this.isGrounded = false;
        } else {
          this.y = this.baseY;
          this.vy = 0;
          this.isGrounded = true;
          if (this.state === 'jump') this.state = 'idle';
        }

        // Auto facing opponent
        if (this.state !== 'dead' && this.state !== 'knockdown' && gameState.status === 'fighting') {
          this.facing = this.x < opponent.x ? 1 : -1;
        }

        // State timer tick
        if (this.stateTimer > 0) {
          this.stateTimer--;
          if (this.stateTimer <= 0) {
            if (this.state === 'punch' || this.state === 'kick' || this.state === 'hurt' || this.state === 'ult') {
              this.state = 'idle';
            }
          }
        }

        // Alt Ego timer
        if (this.altEgo) {
          this.altEgoTimer--;
          // Spawn fiery purple aura particles
          if (Math.random() < 0.6) {
            particles.push(new Particle(
              this.x + (Math.random() - 0.5) * 50,
              this.y - 40 + (Math.random() - 0.5) * 60,
              (Math.random() - 0.5) * 2,
              -1.5 - Math.random() * 2,
              Math.random() > 0.5 ? '#c084fc' : '#f43f5e',
              2 + Math.random() * 3,
              25
            ));
          }
          if (this.altEgoTimer <= 0) {
            this.altEgo = false;
            document.getElementById('sbe3RageTag').classList.add('hidden');
          }
        }

        // Camo timer
        if (this.camo) {
          this.camoTimer--;
          if (this.camoTimer <= 0) {
            this.camo = false;
            document.getElementById('charStanceTag').classList.add('hidden');
          }
        }

        // Combo decay timer
        if (this.comboTimer > 0) {
          this.comboTimer--;
          if (this.comboTimer <= 0) {
            this.comboCount = 0;
            this.comboDmg = 0;
            const display = document.getElementById(this.id === 'p1' ? 'p1ComboDisplay' : 'p2ComboDisplay');
            display.style.opacity = '0';
          }
        }
      }

      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.scale(this.facing, 1);

        // Alpha for Camo
        if (this.camo) {
          c.globalAlpha = 0.35;
        }

        // Draw shadow on ground
        c.fillStyle = 'rgba(0, 0, 0, 0.45)';
        c.beginPath();
        c.ellipse(0, 0, 42, 10, 0, 0, Math.PI * 2);
        c.fill();

        // Check which fighter to render
        if (this.id === 'p1') {
          this.drawSbe3(c);
        } else {
          this.drawCharlomanti(c);
        }

        c.restore();
      }

      // SBE3 DRAW ROUTINE (LION WARRIOR)
      drawSbe3(c) {
        const isPunch = this.state === 'punch';
        const isKick = this.state === 'kick';
        const isCrouch = this.state === 'crouch';
        const isHurt = this.state === 'hurt';
        const isUlt = this.state === 'ult';

        const headY = isCrouch ? -50 : -95;
        const torsoY = isCrouch ? -20 : -55;

        // Alt Ego Flaming Aura
        if (this.altEgo) {
          c.save();
          c.shadowColor = '#c084fc';
          c.shadowBlur = 35;
          c.strokeStyle = '#f43f5e';
          c.lineWidth = 4;
          c.strokeRect(-35, headY - 35, 70, 110);
          c.restore();
        }

        // Charisma Golden Radiance during Ult
        if (isUlt) {
          c.save();
          c.fillStyle = 'rgba(250, 204, 21, 0.35)';
          c.beginPath();
          c.arc(0, headY, 80, 0, Math.PI * 2);
          c.fill();
          c.restore();
        }

        // Lion Legs
        c.fillStyle = '#78350f';
        if (isKick) {
          // Dynamic extended kick
          c.fillRect(-15, -35, 18, 35);
          c.fillStyle = '#b45309';
          c.fillRect(0, -55, 65, 20); // extended lion kick leg
          c.fillStyle = '#facc15';
          c.beginPath();
          c.moveTo(65, -55);
          c.lineTo(75, -45);
          c.lineTo(65, -35);
          c.fill(); // gold claw foot
        } else if (isCrouch) {
          c.fillRect(-22, -25, 20, 25);
          c.fillRect(5, -25, 20, 25);
        } else {
          c.fillRect(-20, -35, 18, 35);
          c.fillRect(4, -35, 18, 35);
        }

        // Muscular Torso & Royal Armor
        c.fillStyle = this.altEgo ? '#581c87' : '#9a3412';
        c.fillRect(-25, torsoY, 50, 42);

        // Golden Royal Chestplate
        c.fillStyle = '#f59e0b';
        c.fillRect(-18, torsoY + 4, 36, 20);
        c.fillStyle = '#fef08a';
        c.beginPath();
        c.moveTo(0, torsoY + 6);
        c.lineTo(8, torsoY + 20);
        c.lineTo(-8, torsoY + 20);
        c.fill();

        // Giant Lion Mane
        c.fillStyle = this.altEgo ? '#7e22ce' : '#d97706';
        c.beginPath();
        c.arc(0, headY, 38, 0, Math.PI * 2);
        c.fill();

        // Head
        c.fillStyle = '#b45309';
        c.beginPath();
        c.arc(0, headY, 26, 0, Math.PI * 2);
        c.fill();

        // Crown / Spikes
        c.fillStyle = '#facc15';
        c.beginPath();
        c.moveTo(-20, headY - 26);
        c.lineTo(-12, headY - 42);
        c.lineTo(0, headY - 30);
        c.lineTo(12, headY - 42);
        c.lineTo(20, headY - 26);
        c.fill();

        // Fierce Glowing Eyes
        c.fillStyle = this.altEgo ? '#f43f5e' : (isHurt ? '#ef4444' : '#fef08a');
        c.fillRect(6, headY - 8, 8, 5);
        c.fillRect(-14, headY - 8, 8, 5);

        // Snout
        c.fillStyle = '#fef3c7';
        c.beginPath();
        c.ellipse(0, headY + 7, 10, 8, 0, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = '#78350f';
        c.fillRect(-4, headY + 3, 8, 5); // nose

        // Claws & Arms
        c.fillStyle = '#b45309';
        if (isPunch) {
          // Punch extended forward
          c.fillRect(5, torsoY + 6, 55, 16);
          c.fillStyle = '#facc15';
          c.fillRect(56, torsoY + 3, 15, 22); // Golden Lion Fist
        } else {
          c.fillRect(15, torsoY + 8, 16, 26);
          c.fillRect(-28, torsoY + 8, 16, 26);
        }
      }

      // CHARLOMANTI DRAW ROUTINE (JAGUAR HUNTRESS)
      drawCharlomanti(c) {
        const isPunch = this.state === 'punch';
        const isKick = this.state === 'kick';
        const isCrouch = this.state === 'crouch';
        const isHurt = this.state === 'hurt';
        const isUlt = this.state === 'ult';

        const headY = isCrouch ? -48 : -92;
        const torsoY = isCrouch ? -20 : -52;

        // Shadow Camo Trail / Apex Ult Aura
        if (isUlt) {
          c.save();
          c.fillStyle = 'rgba(16, 185, 129, 0.4)';
          c.beginPath();
          c.arc(0, headY, 80, 0, Math.PI * 2);
          c.fill();
          c.restore();
        }

        // Swishing Jaguar Tail
        c.strokeStyle = '#d97706';
        c.lineWidth = 6;
        c.beginPath();
        c.moveTo(-18, torsoY + 30);
        c.quadraticCurveTo(-45, torsoY + 15, -40, torsoY - 10);
        c.stroke();

        // Legs / Law Doc Kick Mechanics
        c.fillStyle = '#065f46';
        if (isKick) {
          // LOW DOCK SWEEP POSE (Hits extremely low to the ankles)
          c.fillStyle = '#047857';
          c.fillRect(-15, -20, 18, 20);
          c.fillStyle = '#10b981';
          c.fillRect(0, -14, 75, 16); // sweeping low kick leg
          c.fillStyle = '#34d399';
          c.beginPath();
          c.moveTo(75, -14);
          c.lineTo(85, -6);
          c.lineTo(75, 2);
          c.fill(); // sharp claw foot sweep
        } else if (isCrouch) {
          c.fillRect(-20, -24, 18, 24);
          c.fillRect(4, -24, 18, 24);
        } else {
          c.fillRect(-18, -35, 16, 35);
          c.fillRect(4, -35, 16, 35);
        }

        // Slender Athletic Torso & Armor
        c.fillStyle = '#047857';
        c.fillRect(-20, torsoY, 40, 40);

        // Jaguar Spots on Torso
        c.fillStyle = '#0f172a';
        c.beginPath();
        c.arc(-8, torsoY + 10, 4, 0, Math.PI * 2);
        c.arc(8, torsoY + 18, 4, 0, Math.PI * 2);
        c.arc(-4, torsoY + 28, 3.5, 0, Math.PI * 2);
        c.fill();

        // Jaguar Hair & Ears
        c.fillStyle = '#0f172a';
        c.beginPath();
        c.arc(0, headY, 30, 0, Math.PI * 2);
        c.fill();

        // Pointy Jaguar Ears
        c.fillStyle = '#d97706';
        c.beginPath();
        c.moveTo(-16, headY - 20);
        c.lineTo(-24, headY - 38);
        c.lineTo(-6, headY - 24);
        c.fill();
        c.beginPath();
        c.moveTo(16, headY - 20);
        c.lineTo(24, headY - 38);
        c.lineTo(6, headY - 24);
        c.fill();

        // Face & Emerald Eyes
        c.fillStyle = '#fbbf24';
        c.beginPath();
        c.arc(0, headY, 22, 0, Math.PI * 2);
        c.fill();

        // Jaguar Mask Stripes
        c.fillStyle = '#064e3b';
        c.fillRect(-14, headY - 2, 7, 3);
        c.fillRect(7, headY - 2, 7, 3);

        // Glowing Cat Eyes
        c.fillStyle = isHurt ? '#ef4444' : '#34d399';
        c.fillRect(-11, headY - 6, 7, 5);
        c.fillRect(4, headY - 6, 7, 5);

        // Slender Arms & Claws
        c.fillStyle = '#065f46';
        if (isPunch) {
          c.fillRect(5, torsoY + 6, 52, 14);
          c.fillStyle = '#34d399';
          c.fillRect(54, torsoY + 2, 14, 20); // Jaguar Razor Claw
        } else {
          c.fillRect(12, torsoY + 6, 14, 24);
          c.fillRect(-24, torsoY + 6, 14, 24);
        }
      }
    }

    // ==========================================
    // 3. GAME STATE & MATCH LOGIC
    // ==========================================
    const p1 = new Fighter('p1', 'Sbe3', 250, 440, 1, '#f59e0b');
    const p2 = new Fighter('p2', 'Charlomanti', 710, 440, -1, '#10b981');

    const gameState = {
      status: 'intro', // intro, fighting, finish_him, fatality, round_over, match_over
      round: 1,
      maxRounds: 3,
      timer: 99,
      timerInterval: null,
      cpuEnabled: true,
      lastHitTime: 0
    };

    // Keyboard keys tracking
    const keys = {};
    window.addEventListener('keydown', (e) => {
      initAudio();
      keys[e.key.toLowerCase()] = true;
      handleKeyboard(e.key.toLowerCase());
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
      if (e.key.toLowerCase() === 'a' || e.key.toLowerCase() === 'd') {
        if (p1.state === 'walk') p1.state = 'idle';
        p1.vx = 0;
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        if (!gameState.cpuEnabled && p2.state === 'walk') p2.state = 'idle';
        p2.vx = 0;
      }
      if (e.key.toLowerCase() === 's') {
        if (p1.state === 'crouch') p1.state = 'idle';
      }
      if (e.key === 'ArrowDown') {
        if (!gameState.cpuEnabled && p2.state === 'crouch') p2.state = 'idle';
      }
    });

    function handleKeyboard(k) {
      if (gameState.status !== 'fighting') return;

      // Sbe3 (P1)
      if (k === 'w' && p1.isGrounded) {
        p1.vy = -18;
        p1.state = 'jump';
      }
      if (k === 's') p1.state = 'crouch';
      if (k === 'a') { p1.vx = -5; p1.state = 'walk'; }
      if (k === 'd') { p1.vx = 5; p1.state = 'walk'; }
      if (k === 'j') handleAction('p1', 'punch');
      if (k === 'k') handleAction('p1', 'kick');
      if (k === 'u') handleAction('p1', 'alt_ego');
      if (k === 'i') handleAction('p1', 'ult');

      // Charlomanti (P2 if manual 2P mode)
      if (!gameState.cpuEnabled) {
        if (k === 'arrowup' && p2.isGrounded) { p2.vy = -18; p2.state = 'jump'; }
        if (k === 'arrowdown') p2.state = 'crouch';
        if (k === 'arrowleft') { p2.vx = -5; p2.state = 'walk'; }
        if (k === 'arrowright') { p2.vx = 5; p2.state = 'walk'; }
        if (k === '4') handleAction('p2', 'punch');
        if (k === '5') handleAction('p2', 'kick');
        if (k === '1') handleAction('p2', 'camo');
        if (k === '2') handleAction('p2', 'ult');
      }
    }

    function toggleAI() {
      gameState.cpuEnabled = !gameState.cpuEnabled;
      const status = document.getElementById('aiStatus');
      status.textContent = gameState.cpuEnabled ? 'ON' : 'OFF (2P)';
      status.className = gameState.cpuEnabled ? 'text-green-400' : 'text-amber-400';
    }

    // Execute Move / Strike
    function handleAction(fighterId, action) {
      initAudio();
      const attacker = fighterId === 'p1' ? p1 : p2;
      const defender = fighterId === 'p1' ? p2 : p1;

      if (attacker.state === 'dead' || attacker.state === 'knockdown') return;
      if (gameState.status !== 'fighting' && gameState.status !== 'finish_him') return;

      // PUNCH
      if (action === 'punch') {
        attacker.state = 'punch';
        attacker.stateTimer = 14;
        playPunchSFX();

        // Check Hitbox Collision
        const dist = Math.abs(attacker.x - defender.x);
        if (dist < 110) {
          applyDamage(attacker, defender, 10, 'PUNCH', '#f59e0b');
        }
      }

      // KICK (Sbe3 Lion Kick / Charlomanti signature Law Doc Hits)
      else if (action === 'kick') {
        attacker.state = 'kick';
        attacker.stateTimer = 18;

        if (attacker.id === 'p2') {
          // CHARLOMANTI: LAW DOC HITS! (3-hit rapid low sweep)
          playLawDocSweepSFX();
          const dist = Math.abs(attacker.x - defender.x);
          if (dist < 125) {
            applyDamage(attacker, defender, 8, 'LAW DOC 1', '#14b8a6');
            setTimeout(() => {
              if (defender.hp > 0) applyDamage(attacker, defender, 8, 'LAW DOC 2', '#14b8a6');
            }, 90);
            setTimeout(() => {
              if (defender.hp > 0) {
                applyDamage(attacker, defender, 10, 'LAW DOC CRIT!', '#2dd4bf');
                // Knockdown defender
                defender.vy = -6;
                defender.vx = attacker.facing * 8;
                triggerScreenShake();
              }
            }, 180);
          }
        } else {
          // SBE3: Lion Kick
          playPunchSFX();
          const dist = Math.abs(attacker.x - defender.x);
          if (dist < 115) {
            applyDamage(attacker, defender, 14, 'LION KICK', '#f59e0b');
          }
        }
      }

      // SBE3: ALT EGO SHIFT
      else if (action === 'alt_ego' && attacker.id === 'p1') {
        if (!attacker.altEgo) {
          attacker.altEgo = true;
          attacker.altEgoTimer = 350; // ~6 seconds
          playAltEgoRoarSFX();
          speakAnnouncer('Alt Ego Unleashed!');
          document.getElementById('sbe3RageTag').classList.remove('hidden');
          showFloatingText(attacker.x, attacker.y - 80, 'ALT EGO +60% ATK!', '#c084fc');
          triggerScreenShake();
        }
      }

      // CHARLOMANTI: CAMO
      else if (action === 'camo' && attacker.id === 'p2') {
        if (!attacker.camo) {
          attacker.camo = true;
          attacker.camoTimer = 300;
          playAltEgoRoarSFX();
          document.getElementById('charStanceTag').classList.remove('hidden');
          showFloatingText(attacker.x, attacker.y - 80, 'STEALTH CAMO', '#34d399');
        }
      }

      // ULTIMATE: CHARISMA ULT / APEX JAGUAR ULT
      else if (action === 'ult') {
        if (attacker.superGauge < 100) return;
        attacker.superGauge = 0;
        attacker.state = 'ult';
        attacker.stateTimer = 45;

        if (attacker.id === 'p1') {
          // Sbe3 Charisma Ult
          playCharismaUltSFX();
          speakAnnouncer('Charisma Ultimate!');
          showAnnouncement('CHARISMA ULT!', 'BOW TO THE SULTAN OF CHARISMA!', '#eab308');
          triggerScreenShake();

          setTimeout(() => {
            const dist = Math.abs(attacker.x - defender.x);
            if (dist < 350) {
              applyDamage(attacker, defender, 38, 'CHARISMA CRIT!', '#facc15', true);
              spawnBlood(defender.x, defender.y - 60, 45);
              defender.vy = -12;
              defender.vx = attacker.facing * 12;
            }
          }, 400);
        } else {
          // Charlomanti Apex Jaguar Ult
          playCharismaUltSFX();
          speakAnnouncer('Apex Predator!');
          showAnnouncement('APEX JAGUAR!', 'SHADOWS OF THE ANCIENT RAINFOREST!', '#10b981');
          triggerScreenShake();

          setTimeout(() => {
            const dist = Math.abs(attacker.x - defender.x);
            if (dist < 350) {
              applyDamage(attacker, defender, 40, 'APEX SHRED!', '#34d399', true);
              spawnBlood(defender.x, defender.y - 60, 50);
              defender.vy = -12;
              defender.vx = attacker.facing * 12;
            }
          }, 400);
        }
      }
    }

    // Apply Hit & Damage
    function applyDamage(attacker, defender, baseDmg, textLabel, color, isHeavy = false) {
      if (defender.state === 'dead') return;

      let dmg = baseDmg;
      if (attacker.altEgo) dmg = Math.floor(dmg * 1.6); // Alt Ego +60% dmg boost!
      if (defender.camo) {
        dmg = Math.floor(dmg * 0.4); // Camo absorbs 60% dmg
        defender.camo = false;
        document.getElementById('charStanceTag').classList.add('hidden');
      }

      // Deal HP
      defender.hp = Math.max(0, defender.hp - dmg);
      defender.state = 'hurt';
      defender.stateTimer = 16;
      defender.vx = attacker.facing * 4;

      // Charge super gauges
      attacker.superGauge = Math.min(100, attacker.superGauge + 15);
      defender.superGauge = Math.min(100, defender.superGauge + 10);

      // Hit sparks & blood
      spawnHitSparks(defender.x, defender.y - 50, color, isHeavy ? 25 : 12);
      spawnBlood(defender.x, defender.y - 50, isHeavy ? 35 : 15);
      if (isHeavy) playHeavyHitSFX(); else playPunchSFX();
      triggerScreenShake();

      // Combo Counter
      attacker.comboCount++;
      attacker.comboDmg += dmg;
      attacker.comboTimer = 70; // reset combo window
      updateComboDisplay(attacker);

      // Floating damage number
      showFloatingText(defender.x, defender.y - 70, `-${dmg} ${textLabel}`, color);

      // Check for Finish Him
      updateHUD();
      if (defender.hp <= 0) {
        onDefenderDefeated(defender, attacker);
      }
    }

    function updateComboDisplay(attacker) {
      const display = document.getElementById(attacker.id === 'p1' ? 'p1ComboDisplay' : 'p2ComboDisplay');
      const hitsEl = document.getElementById(attacker.id === 'p1' ? 'p1ComboHits' : 'p2ComboHits');
      const dmgEl = document.getElementById(attacker.id === 'p1' ? 'p1ComboDmg' : 'p2ComboDmg');

      if (attacker.comboCount >= 2) {
        display.style.opacity = '1';
        hitsEl.textContent = `${attacker.comboCount} HITS`;
        dmgEl.textContent = `${attacker.comboDmg}% DAMAGE`;
      }
    }

    // FINISH HIM & FATALITY SEQUENCES
    function onDefenderDefeated(loser, winner) {
      clearInterval(gameState.timerInterval);
      loser.state = 'dead';
      loser.vx = 0;

      // Round check: If it's final round (match winning point) -> FINISH HIM!
      if (winner.roundWins === 1) {
        gameState.status = 'finish_him';
        const loserPronoun = loser.id === 'p1' ? 'HIM' : 'HER';
        showAnnouncement(`FINISH ${loserPronoun}!`, 'CHOOSE YOUR FATALITY', '#dc2626');
        speakAnnouncer(`Finish ${loserPronoun.toLowerCase()}!`);
        document.getElementById('fatalityPrompt').classList.remove('hidden');

        // Auto timer if no fatality selected within 5 seconds
        setTimeout(() => {
          if (gameState.status === 'finish_him') {
            document.getElementById('fatalityPrompt').classList.add('hidden');
            resolveRoundVictory(winner);
          }
        }, 5500);
      } else {
        // Just round end
        resolveRoundVictory(winner);
      }
    }

    function triggerFatality(type) {
      document.getElementById('fatalityPrompt').classList.add('hidden');
      gameState.status = 'fatality';
      triggerScreenShake();

      const isSbe3 = type === 'sbe3';
      const winner = isSbe3 ? p1 : p2;
      const loser = isSbe3 ? p2 : p1;

      // Slow motion blood bath
      for (let i = 0; i < 80; i++) {
        setTimeout(() => {
          spawnBlood(loser.x + (Math.random() - 0.5) * 40, loser.y - 60, 20);
          playHeavyHitSFX();
        }, i * 35);
      }

      showAnnouncement('FATALITY!', `${winner.name.toUpperCase()} WINS!`, '#dc2626');
      speakAnnouncer('Fatality! ' + winner.name + ' wins!');

      setTimeout(() => {
        resolveMatchOver(winner);
      }, 3500);
    }

    function resolveRoundVictory(winner) {
      gameState.status = 'round_over';
      winner.roundWins++;
      updateRoundDots();

      if (winner.roundWins >= 2) {
        showAnnouncement(`${winner.name.toUpperCase()} WINS!`, 'FLAWLESS VICTORY', winner.colorTheme);
        speakAnnouncer(`${winner.name} wins!`);
        setTimeout(() => resolveMatchOver(winner), 2500);
      } else {
        showAnnouncement(`${winner.name.toUpperCase()} TAKES ROUND!`, '', winner.colorTheme);
        speakAnnouncer(`${winner.name} takes the round!`);
        setTimeout(() => startNextRound(), 2500);
      }
    }

    function resolveMatchOver(winner) {
      gameState.status = 'match_over';
      showAnnouncement('CHAMPION', `${winner.name.toUpperCase()} RULES THE REALM`, winner.colorTheme);
    }

    function startNextRound() {
      gameState.round++;
      document.getElementById('roundText').textContent = `ROUND ${gameState.round}`;
      resetRoundPositions();
      startRoundCountdown();
    }

    function resetRoundPositions() {
      p1.x = 250;
      p1.y = 440;
      p1.hp = 100;
      p1.state = 'idle';
      p1.altEgo = false;

      p2.x = 710;
      p2.y = 440;
      p2.hp = 100;
      p2.state = 'idle';
      p2.camo = false;

      updateHUD();
    }

    function resetMatch(fullReset = false) {
      if (fullReset) {
        p1.roundWins = 0;
        p2.roundWins = 0;
        gameState.round = 1;
        document.getElementById('roundText').textContent = 'ROUND 1';
        updateRoundDots();
      }
      document.getElementById('fatalityPrompt').classList.add('hidden');
      resetRoundPositions();
      startRoundCountdown();
    }

    function updateRoundDots() {
      const p1Dots = document.getElementById('p1Rounds').children;
      const p2Dots = document.getElementById('p2Rounds').children;
      for (let i = 0; i < 2; i++) {
        p1Dots[i].className = i < p1.roundWins ? 'w-3 h-3 rounded-full bg-amber-500 shadow-[0_0_8px_#f59e0b]' : 'w-3 h-3 rounded-full border border-amber-500/50 bg-slate-900';
        p2Dots[i].className = i < p2.roundWins ? 'w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'w-3 h-3 rounded-full border border-emerald-500/50 bg-slate-900';
      }
    }

    // Round countdown: "ROUND 1... FIGHT!"
    function startRoundCountdown() {
      gameState.status = 'intro';
      gameState.timer = 99;
      document.getElementById('matchTimer').textContent = '99';

      showAnnouncement(`ROUND ${gameState.round}`, '', '#ef4444');
      speakAnnouncer(`Round ${gameState.round}`);

      setTimeout(() => {
        showAnnouncement('FIGHT!', '', '#eab308');
        speakAnnouncer('Fight!');
        gameState.status = 'fighting';
        hideAnnouncement(800);

        // Start 99s timer
        if (gameState.timerInterval) clearInterval(gameState.timerInterval);
        gameState.timerInterval = setInterval(() => {
          if (gameState.status === 'fighting') {
            gameState.timer--;
            document.getElementById('matchTimer').textContent = gameState.timer;
            if (gameState.timer <= 0) {
              clearInterval(gameState.timerInterval);
              // Time over winner
              const winner = p1.hp >= p2.hp ? p1 : p2;
              resolveRoundVictory(winner);
            }
          }
        }, 1000);
      }, 1400);
    }

    // UI Announcement Layer
    function showAnnouncement(main, sub, color = '#ef4444') {
      const textEl = document.getElementById('announcementText');
      const subEl = document.getElementById('subAnnouncementText');
      textEl.textContent = main;
      textEl.style.color = color;
      textEl.className = 'mk-title text-4xl sm:text-7xl md:text-8xl font-black tracking-widest uppercase transform scale-110 transition-transform duration-200 drop-shadow-[0_10px_35px_rgba(0,0,0,0.95)]';

      if (sub) {
        subEl.textContent = sub;
        subEl.style.opacity = '1';
      } else {
        subEl.style.opacity = '0';
      }
    }

    function hideAnnouncement(delay = 500) {
      setTimeout(() => {
        const textEl = document.getElementById('announcementText');
        textEl.className = 'text-4xl sm:text-7xl md:text-8xl font-black tracking-widest text-transparent uppercase transform scale-0 transition-transform duration-200';
        document.getElementById('subAnnouncementText').style.opacity = '0';
      }, delay);
    }

    function showFloatingText(x, y, text, color = '#f59e0b') {
      const overlay = document.getElementById('damageOverlay');
      const el = document.createElement('div');
      el.className = 'absolute text-base sm:text-xl font-black floating-dmg arcade-font';
      el.style.color = color;
      el.style.left = `${(x / 960) * 100}%`;
      el.style.top = `${(y / 540) * 100}%`;
      el.textContent = text;
      overlay.appendChild(el);
      setTimeout(() => el.remove(), 750);
    }

    function triggerScreenShake() {
      const container = document.getElementById('gameContainer');
      container.classList.remove('shake-impact');
      void container.offsetWidth;
      container.classList.add('shake-impact');
      setTimeout(() => container.classList.remove('shake-impact'), 300);
    }

    function updateHUD() {
      // P1 Health
      const p1Pct = Math.max(0, p1.hp);
      document.getElementById('p1HpBar').style.width = `${p1Pct}%`;
      setTimeout(() => {
        document.getElementById('p1HpBackdrop').style.width = `${p1Pct}%`;
      }, 200);

      document.getElementById('p1SuperBar').style.width = `${p1.superGauge}%`;
      document.getElementById('p1SuperText').textContent = `${p1.superGauge}%`;
      document.getElementById('p1UltButton').disabled = p1.superGauge < 100;

      // P2 Health
      const p2Pct = Math.max(0, p2.hp);
      document.getElementById('p2HpBar').style.width = `${p2Pct}%`;
      setTimeout(() => {
        document.getElementById('p2HpBackdrop').style.width = `${p2Pct}%`;
      }, 200);

      document.getElementById('p2SuperBar').style.width = `${p2.superGauge}%`;
      document.getElementById('p2SuperText').textContent = `${p2.superGauge}%`;
      document.getElementById('p2UltButton').disabled = p2.superGauge < 100;
    }

    // ==========================================
    // 4. INTELLIGENT AI (CPU CHARLOMANTI)
    // ==========================================
    let aiTick = 0;
    function updateAI() {
      if (!gameState.cpuEnabled || gameState.status !== 'fighting') return;
      aiTick++;
      if (aiTick % 18 !== 0) return; // run AI decisions periodically

      const dist = Math.abs(p2.x - p1.x);

      // AI Charlomanti decision tree
      if (p2.superGauge >= 100 && Math.random() < 0.8) {
        handleAction('p2', 'ult');
      } else if (!p2.camo && Math.random() < 0.25) {
        handleAction('p2', 'camo');
      } else if (dist < 120) {
        // In strike range -> Use signature Law Doc Hits or punches
        if (Math.random() < 0.65) {
          handleAction('p2', 'kick'); // Law Doc Hits!
        } else {
          handleAction('p2', 'punch');
        }
      } else {
        // Move towards Sbe3 with agile leaps
        p2.vx = p2.x > p1.x ? -4.5 : 4.5;
        p2.state = 'walk';
        if (Math.random() < 0.2 && p2.isGrounded) {
          p2.vy = -16;
          p2.state = 'jump';
        }
      }
    }

    // ==========================================
    // 5. STAGE DRAWING (THE OUTWORLD TEMPLE)
    // ==========================================
    function drawArenaBackground(c) {
      // Dark gothic sky gradient
      const skyGrad = c.createLinearGradient(0, 0, 0, 440);
      skyGrad.addColorStop(0, '#020617');
      skyGrad.addColorStop(0.5, '#1e1b4b');
      skyGrad.addColorStop(1, '#450a0a');
      c.fillStyle = skyGrad;
      c.fillRect(0, 0, 960, 540);

      // Blood Moon
      c.save();
      c.fillStyle = '#dc2626';
      c.shadowColor = '#ef4444';
      c.shadowBlur = 45;
      c.beginPath();
      c.arc(480, 120, 55, 0, Math.PI * 2);
      c.fill();
      c.restore();

      // Ancient Temple Pillars
      c.fillStyle = '#0f172a';
      [-30, 200, 720, 930].forEach((px) => {
        c.fillRect(px, 120, 60, 320);
        // Pillar capital & base
        c.fillRect(px - 8, 110, 76, 16);
        c.fillRect(px - 6, 420, 72, 20);
      });

      // Animated Torches on pillars
      [230, 750].forEach((tx) => {
        c.save();
        c.fillStyle = Math.random() > 0.5 ? '#f59e0b' : '#ef4444';
        c.shadowColor = '#f59e0b';
        c.shadowBlur = 25;
        c.beginPath();
        c.arc(tx, 220, 9 + Math.sin(Date.now() * 0.01) * 3, 0, Math.PI * 2);
        c.fill();
        c.restore();
      });

      // Stone Arena Floor with Blood Stains
      const floorGrad = c.createLinearGradient(0, 440, 0, 540);
      floorGrad.addColorStop(0, '#1c1917');
      floorGrad.addColorStop(0.2, '#292524');
      floorGrad.addColorStop(1, '#09090b');
      c.fillStyle = floorGrad;
      c.fillRect(0, 440, 960, 100);

      // Floor tiles lines
      c.strokeStyle = '#44403c';
      c.lineWidth = 1.5;
      for (let x = 0; x < 960; x += 60) {
        c.beginPath();
        c.moveTo(x, 440);
        c.lineTo(x - 30, 540);
        c.stroke();
      }
      c.strokeRect(0, 440, 960, 1);
    }

    // ==========================================
    // 6. MAIN 60FPS GAME LOOP
    // ==========================================
    function gameLoop() {
      // Clear & Draw Stage
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawArenaBackground(ctx);

      // Update AI
      updateAI();

      // Update & Draw Fighters
      p1.update(p2);
      p2.update(p1);

      p1.draw(ctx);
      p2.draw(ctx);

      // Update & Draw Particles (Blood, Sparks)
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].life <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    // Start everything!
    resetMatch(true);
    requestAnimationFrame(gameLoop);
  </script>
</body>
