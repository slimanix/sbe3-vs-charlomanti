<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sbe3 vs Charlomanti - Mortal Kombat Arena</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Permanent+Marker&family=Orbitron:wght@700;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #110508 0%, #050204 100%);
      font-family: 'Cinzel', serif;
      overflow-y: auto;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    .arcade-font {
      font-family: 'Orbitron', monospace;
    }

    .mk-font {
      font-family: 'Cinzel', serif;
      text-shadow: 0 0 15px #dc2626, 0 0 35px #991b1b, 0 3px 0 #450a0a;
    }

    .fatality-text {
      font-family: 'Permanent Marker', cursive;
      text-shadow: 0 0 25px #ef4444, 0 0 50px #b91c1c;
    }

    /* Screen shake */
    @keyframes impactShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 6px); }
      40% { transform: translate(8px, -6px); }
      60% { transform: translate(-5px, 4px); }
      80% { transform: translate(5px, -3px); }
      100% { transform: translate(0, 0); }
    }
    .shake {
      animation: impactShake 0.25s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* Floating damage */
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.9); }
      40% { transform: translateY(-25px) scale(1.3); }
      100% { opacity: 0; transform: translateY(-50px) scale(1); }
    }
    .floating-text {
      animation: floatUp 0.8s ease-out forwards;
      pointer-events: none;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center p-2 sm:p-4">

  <!-- TOP BAR: Controls & Info -->
  <header class="w-full max-w-5xl flex items-center justify-between pb-2 border-b border-red-950/80 mb-2">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🐉</span>
      <div>
        <h1 class="mk-font text-lg sm:text-2xl font-black text-red-500 tracking-wider uppercase leading-none">
          MORTAL KOMBAT
        </h1>
        <p class="text-[10px] sm:text-xs text-amber-500 tracking-widest font-mono uppercase">
          SBE3 (LION) VS CHARLOMANTI (JAGUAR)
        </p>
      </div>
    </div>

    <!-- Quick Buttons -->
    <div class="flex items-center gap-2 text-xs">
      <button id="soundBtn" onclick="toggleAudio()" class="px-2.5 py-1 rounded bg-slate-900 border border-slate-700 hover:border-red-500 font-bold transition flex items-center gap-1">
        🔊 Sound: <span id="soundText" class="text-green-400">ON</span>
      </button>
      <button id="aiBtn" onclick="toggleAI()" class="px-2.5 py-1 rounded bg-slate-900 border border-slate-700 hover:border-amber-500 font-bold transition flex items-center gap-1">
        🤖 CPU: <span id="aiText" class="text-green-400">ON</span>
      </button>
      <button onclick="resetMatch(true)" class="px-3 py-1 rounded bg-red-700 hover:bg-red-600 text-white font-black tracking-wider uppercase shadow-md transition active:scale-95">
        🔄 Restart
      </button>
    </div>
  </header>

  <!-- MAIN ARCADE CABINET FRAME -->
  <div id="arcadeWrapper" class="relative w-full max-w-5xl rounded-xl border-2 border-red-900/80 shadow-[0_0_40px_rgba(185,28,28,0.3)] bg-black overflow-hidden flex flex-col">
    
    <!-- Top HUD Overlaid on Screen -->
    <div class="absolute top-0 left-0 right-0 z-20 p-2 sm:p-4 pointer-events-none flex flex-col gap-1">
      
      <!-- Health Bars & Center Timer -->
      <div class="grid grid-cols-12 gap-2 items-center">
        
        <!-- P1 SBE3 HUD -->
        <div class="col-span-5 flex flex-col gap-1">
          <div class="flex items-center justify-between text-xs sm:text-sm font-black">
            <div class="flex items-center gap-1.5 text-amber-400">
              <span>🦁 SBE3</span>
              <span id="sbe3AltTag" class="hidden px-1.5 py-0.2 text-[9px] bg-purple-900 text-purple-200 border border-purple-400 rounded animate-pulse">ALT EGO</span>
            </div>
            <div id="p1Dots" class="flex gap-1">
              <span class="w-2.5 h-2.5 rounded-full border border-amber-500 bg-slate-900"></span>
              <span class="w-2.5 h-2.5 rounded-full border border-amber-500 bg-slate-900"></span>
            </div>
          </div>
          <!-- Health Bar -->
          <div class="w-full bg-slate-950 h-5 sm:h-6 p-0.5 border border-amber-500 skew-x-[-12deg] shadow-lg relative overflow-hidden">
            <div id="p1Backdrop" class="absolute inset-0 bg-red-800 transition-all duration-500 w-full"></div>
            <div id="p1Bar" class="h-full bg-gradient-to-r from-emerald-500 via-amber-400 to-yellow-300 w-full transition-all duration-100 relative"></div>
          </div>
          <!-- Super Gauge -->
          <div class="flex items-center justify-between text-[10px] text-amber-300/80 font-mono">
            <span>✨ CHARISMA ULT</span>
            <span id="p1SuperText">0%</span>
          </div>
          <div class="w-full bg-slate-950 h-1.5 border border-amber-700/60 skew-x-[-12deg] overflow-hidden">
            <div id="p1SuperBar" class="h-full bg-gradient-to-r from-amber-500 to-yellow-300 w-0 transition-all duration-150"></div>
          </div>
        </div>

        <!-- Center Timer & Round -->
        <div class="col-span-2 flex flex-col items-center justify-center">
          <div id="hudTimer" class="arcade-font text-2xl sm:text-4xl font-black text-yellow-400 drop-shadow-[0_0_15px_#eab308]">
            99
          </div>
          <div id="hudRound" class="text-[10px] sm:text-xs font-bold text-red-500 tracking-widest uppercase">
            ROUND 1
          </div>
        </div>

        <!-- P2 CHARLOMANTI HUD -->
        <div class="col-span-5 flex flex-col gap-1">
          <div class="flex items-center justify-between text-xs sm:text-sm font-black">
            <div id="p2Dots" class="flex gap-1">
              <span class="w-2.5 h-2.5 rounded-full border border-emerald-500 bg-slate-900"></span>
              <span class="w-2.5 h-2.5 rounded-full border border-emerald-500 bg-slate-900"></span>
            </div>
            <div class="flex items-center gap-1.5 text-emerald-400">
              <span id="charCamoTag" class="hidden px-1.5 py-0.2 text-[9px] bg-emerald-950 text-emerald-300 border border-emerald-400 rounded">CAMO</span>
              <span>CHARLOMANTI 🐆</span>
            </div>
          </div>
          <!-- Health Bar -->
          <div class="w-full bg-slate-950 h-5 sm:h-6 p-0.5 border border-emerald-500 skew-x-[12deg] shadow-lg relative overflow-hidden flex justify-end">
            <div id="p2Backdrop" class="absolute inset-0 bg-red-800 transition-all duration-500 w-full"></div>
            <div id="p2Bar" class="h-full bg-gradient-to-l from-emerald-500 via-teal-400 to-cyan-300 w-full transition-all duration-100 relative"></div>
          </div>
          <!-- Super Gauge -->
          <div class="flex items-center justify-between text-[10px] text-emerald-300/80 font-mono">
            <span id="p2SuperText">0%</span>
            <span>⚡ APEX ULT</span>
          </div>
          <div class="w-full bg-slate-950 h-1.5 border border-emerald-700/60 skew-x-[12deg] overflow-hidden flex justify-end">
            <div id="p2SuperBar" class="h-full bg-gradient-to-l from-emerald-500 to-cyan-300 w-0 transition-all duration-150"></div>
          </div>
        </div>

      </div>

    </div>

    <!-- Active Canvas Stage (60 FPS) -->
    <canvas id="stageCanvas" width="960" height="540" class="w-full h-auto aspect-video block bg-black"></canvas>

    <!-- Floating Damage / Text Layer -->
    <div id="damageLayer" class="absolute inset-0 pointer-events-none z-10 overflow-hidden"></div>

    <!-- Announcement Overlay (ROUND 1, FIGHT, FINISH HIM, CHAMPION) -->
    <div id="announcementLayer" class="absolute inset-0 z-30 pointer-events-none flex flex-col items-center justify-center p-4">
      <h2 id="announcementMain" class="mk-font text-4xl sm:text-7xl font-black tracking-widest text-red-500 uppercase scale-0 transition-all duration-200 text-center drop-shadow-[0_10px_25px_rgba(0,0,0,0.9)]">
        FIGHT!
      </h2>
      <p id="announcementSub" class="text-sm sm:text-xl font-bold text-yellow-400 tracking-wider uppercase mt-2 opacity-0 transition-opacity duration-300">
      </p>

      <!-- Prominent REMATCH / PLAY AGAIN Button (Interactive) -->
      <button id="rematchBtn" onclick="resetMatch(true)" class="hidden pointer-events-auto mt-6 px-8 py-3.5 bg-gradient-to-r from-red-600 via-rose-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-black text-sm sm:text-lg uppercase tracking-widest rounded-xl border-2 border-yellow-400 shadow-[0_0_30px_#ef4444] active:scale-95 transition animate-bounce">
        ⚔️ PLAY AGAIN / REMATCH
      </button>

      <!-- Fatality Action Buttons (When in FINISH HIM mode) -->
      <div id="fatalityBar" class="hidden pointer-events-auto mt-4 flex flex-wrap gap-3 justify-center bg-black/90 p-3 rounded-xl border-2 border-red-600 shadow-2xl">
        <button onclick="executeFatality('sbe3')" class="px-4 py-2 bg-red-700 hover:bg-red-600 text-white font-black text-xs uppercase tracking-wider rounded border border-red-400 active:scale-95 transition">
          🦁 SBE3: ALT EGO BEAST RIP
        </button>
        <button onclick="executeFatality('char')" class="px-4 py-2 bg-emerald-800 hover:bg-emerald-700 text-white font-black text-xs uppercase tracking-wider rounded border border-emerald-400 active:scale-95 transition">
          🐆 CHARLOMANTI: LAW DOC SPINE CRUSH
        </button>
      </div>
    </div>

  </div>

  <!-- ON-SCREEN CONTROLS PANEL (EASY CLICKABLE ON ANY DEVICE) -->
  <footer class="w-full max-w-5xl mt-3 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
    
    <!-- Sbe3 Controls Card -->
    <div class="bg-slate-950/90 border border-amber-600/40 rounded-xl p-3 shadow-lg flex flex-col gap-2">
      <div class="flex items-center justify-between text-amber-400 font-bold uppercase pb-1 border-b border-slate-800">
        <span>🦁 Sbe3 Controls (P1)</span>
        <span class="text-[10px] text-slate-400">Keys: [A/D] Move, [W] Jump, [S] Crouch</span>
      </div>
      <!-- Movement & Strike Buttons -->
      <div class="grid grid-cols-4 gap-2">
        <button onmousedown="doAction('p1', 'punch')" class="p-2.5 rounded-lg bg-slate-900 hover:bg-amber-950/60 border border-amber-500/40 font-bold text-amber-300 text-center active:scale-95 transition">
          🐾 Claw Punch<br><span class="text-[10px] text-slate-400">[J]</span>
        </button>
        <button onmousedown="doAction('p1', 'kick')" class="p-2.5 rounded-lg bg-slate-900 hover:bg-amber-950/60 border border-amber-500/40 font-bold text-amber-300 text-center active:scale-95 transition">
          💥 Lion Kick<br><span class="text-[10px] text-slate-400">[K]</span>
        </button>
        <button onmousedown="doAction('p1', 'alt_ego')" class="p-2.5 rounded-lg bg-purple-950/50 hover:bg-purple-900/60 border border-purple-500 font-bold text-purple-300 text-center active:scale-95 transition">
          🎭 Alt Ego Shift<br><span class="text-[10px] text-slate-400">[U] +60% ATK</span>
        </button>
        <button id="p1UltBtn" onmousedown="doAction('p1', 'ult')" class="p-2.5 rounded-lg bg-amber-950/70 hover:bg-amber-700 border border-yellow-400 font-black text-yellow-300 text-center active:scale-95 transition disabled:opacity-40">
          👑 Charisma Ult!<br><span class="text-[10px] text-slate-300">[I] 100%</span>
        </button>
      </div>
    </div>

    <!-- Charlomanti Controls Card -->
    <div class="bg-slate-950/90 border border-emerald-600/40 rounded-xl p-3 shadow-lg flex flex-col gap-2">
      <div class="flex items-center justify-between text-emerald-400 font-bold uppercase pb-1 border-b border-slate-800">
        <span>🐆 Charlomanti Controls (P2 / CPU)</span>
        <span class="text-[10px] text-slate-400">Keys: [←/→] Move, [↑] Jump, [↓] Crouch</span>
      </div>
      <div class="grid grid-cols-4 gap-2">
        <button onmousedown="doAction('p2', 'punch')" class="p-2.5 rounded-lg bg-slate-900 hover:bg-emerald-950/60 border border-emerald-500/40 font-bold text-emerald-300 text-center active:scale-95 transition">
          🐾 Claw Slash<br><span class="text-[10px] text-slate-400">[Num 4]</span>
        </button>
        <button onmousedown="doAction('p2', 'kick')" class="p-2.5 rounded-lg bg-teal-950/50 hover:bg-teal-900/60 border border-teal-400 font-bold text-teal-300 text-center active:scale-95 transition">
          🥋 Law Doc Hits!<br><span class="text-[10px] text-slate-400">[Num 5] 3x Low Sweep</span>
        </button>
        <button onmousedown="doAction('p2', 'camo')" class="p-2.5 rounded-lg bg-slate-900 hover:bg-emerald-950/60 border border-emerald-500 font-bold text-emerald-300 text-center active:scale-95 transition">
          🌫️ Shadow Camo<br><span class="text-[10px] text-slate-400">[Num 1] Dodge</span>
        </button>
        <button id="p2UltBtn" onmousedown="doAction('p2', 'ult')" class="p-2.5 rounded-lg bg-emerald-950/70 hover:bg-emerald-700 border border-emerald-400 font-black text-cyan-300 text-center active:scale-95 transition disabled:opacity-40">
          🌪️ Apex Ult!<br><span class="text-[10px] text-slate-300">[Num 2] 100%</span>
        </button>
      </div>
    </div>

  </footer>

  <!-- SCRIPT ENGINE -->
  <script>
    // =====================================
    // 1. SOUND & ANNOUNCER SYNTHESIZER
    // =====================================
    let audioCtx = null;
    let soundOn = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleAudio() {
      soundOn = !soundOn;
      document.getElementById('soundText').textContent = soundOn ? 'ON' : 'OFF';
      document.getElementById('soundText').className = soundOn ? 'text-green-400' : 'text-red-400';
      if (soundOn) speakAnnouncer('Mortal Kombat');
    }

    function speakAnnouncer(text) {
      if (!soundOn) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.pitch = 0.55;
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
      }
      playSynthGong(70, 0.7);
    }

    function playSynthGong(freq, duration) {
      if (!soundOn) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playPunchSFX() {
      if (!soundOn) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    function playCrunchSFX() {
      if (!soundOn) return;
      initAudio();
      try {
        [80, 140].forEach((f) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(f, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        });
      } catch (e) {}
    }

    function playLawDocSFX() {
      if (!soundOn) return;
      initAudio();
      try {
        [0, 80, 160].forEach((delay, i) => {
          setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420 - (i * 50), audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
          }, delay);
        });
      } catch (e) {}
    }

    // =====================================
    // 2. CANVAS & FIGHTER MODELS
    // =====================================
    const canvas = document.getElementById('stageCanvas');
    const ctx = canvas.getContext('2d');

    const particles = [];
    class Particle {
      constructor(x, y, vx, vy, color, size, life, isBlood = false) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.size = size; this.life = life; this.maxLife = life;
        this.isBlood = isBlood;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.isBlood) {
          this.vy += 0.45;
          if (this.y > 450) { this.y = 450; this.vx = 0; this.vy = 0; }
        } else {
          this.vy += 0.15;
        }
        this.life--;
      }
      draw(c) {
        c.save();
        c.globalAlpha = Math.max(0, this.life / this.maxLife);
        c.fillStyle = this.color;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    function spawnBlood(x, y, count = 20) {
      for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
        const spd = 3 + Math.random() * 7;
        particles.push(new Particle(
          x, y, Math.cos(angle) * spd, Math.sin(angle) * spd,
          Math.random() > 0.3 ? '#dc2626' : '#991b1b',
          2 + Math.random() * 3, 30 + Math.random() * 25, true
        ));
      }
    }

    class Fighter {
      constructor(id, name, x, y, facing, color) {
        this.id = id; this.name = name; this.x = x; this.y = y;
        this.baseY = 445; this.vx = 0; this.vy = 0;
        this.facing = facing; this.color = color;
        this.hp = 100; this.superGauge = 20; this.roundWins = 0;
        this.state = 'idle'; this.stateTimer = 0; this.isGrounded = true;
        this.altEgo = false; this.altEgoTimer = 0;
        this.camo = false; this.camoTimer = 0;
      }

      update(opp) {
        this.x += this.vx;
        if (this.x < 90) this.x = 90;
        if (this.x > 870) this.x = 870;

        this.y += this.vy;
        if (this.y < this.baseY) {
          this.vy += 0.95;
          this.isGrounded = false;
        } else {
          this.y = this.baseY;
          this.vy = 0;
          this.isGrounded = true;
          if (this.state === 'jump') this.state = 'idle';
        }

        if (this.state !== 'dead' && game.status === 'fighting') {
          this.facing = this.x < opp.x ? 1 : -1;
        }

        if (this.stateTimer > 0) {
          this.stateTimer--;
          if (this.stateTimer <= 0) {
            if (this.state === 'punch' || this.state === 'kick' || this.state === 'hurt' || this.state === 'ult') {
              this.state = 'idle';
            }
          }
        }

        if (this.altEgo) {
          this.altEgoTimer--;
          if (Math.random() < 0.5) {
            particles.push(new Particle(
              this.x + (Math.random() - 0.5) * 50, this.y - 50 + (Math.random() - 0.5) * 60,
              (Math.random() - 0.5) * 2, -2,
              Math.random() > 0.5 ? '#c084fc' : '#f43f5e', 3, 20
            ));
          }
          if (this.altEgoTimer <= 0) {
            this.altEgo = false;
            document.getElementById('sbe3AltTag').classList.add('hidden');
          }
        }

        if (this.camo) {
          this.camoTimer--;
          if (this.camoTimer <= 0) {
            this.camo = false;
            document.getElementById('charCamoTag').classList.add('hidden');
          }
        }
      }

      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.scale(this.facing, 1);

        if (this.camo) c.globalAlpha = 0.35;

        // Shadow
        c.fillStyle = 'rgba(0,0,0,0.45)';
        c.beginPath();
        c.ellipse(0, 0, 40, 10, 0, 0, Math.PI * 2);
        c.fill();

        if (this.id === 'p1') {
          this.renderSbe3(c);
        } else {
          this.renderCharlomanti(c);
        }
        c.restore();
      }

      renderSbe3(c) {
        const isPunch = this.state === 'punch';
        const isKick = this.state === 'kick';
        const isCrouch = this.state === 'crouch';
        const isHurt = this.state === 'hurt';

        const headY = isCrouch ? -50 : -95;
        const torsoY = isCrouch ? -20 : -55;

        if (this.altEgo) {
          c.save();
          c.shadowColor = '#c084fc';
          c.shadowBlur = 35;
          c.strokeStyle = '#f43f5e';
          c.lineWidth = 3;
          c.strokeRect(-32, headY - 35, 64, 110);
          c.restore();
        }

        // Legs
        c.fillStyle = '#78350f';
        if (isKick) {
          c.fillRect(-15, -35, 18, 35);
          c.fillStyle = '#b45309';
          c.fillRect(0, -55, 65, 20);
          c.fillStyle = '#facc15';
          c.beginPath();
          c.moveTo(65, -55); c.lineTo(75, -45); c.lineTo(65, -35); c.fill();
        } else {
          c.fillRect(-20, isCrouch ? -25 : -35, 18, isCrouch ? 25 : 35);
          c.fillRect(4, isCrouch ? -25 : -35, 18, isCrouch ? 25 : 35);
        }

        // Torso & Armor
        c.fillStyle = this.altEgo ? '#581c87' : '#9a3412';
        c.fillRect(-24, torsoY, 48, 42);
        c.fillStyle = '#f59e0b';
        c.fillRect(-16, torsoY + 4, 32, 20);

        // Lion Mane
        c.fillStyle = this.altEgo ? '#7e22ce' : '#d97706';
        c.beginPath();
        c.arc(0, headY, 36, 0, Math.PI * 2);
        c.fill();

        // Head & Crown
        c.fillStyle = '#b45309';
        c.beginPath();
        c.arc(0, headY, 25, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = '#facc15';
        c.beginPath();
        c.moveTo(-18, headY - 24); c.lineTo(-10, headY - 40);
        c.lineTo(0, headY - 28); c.lineTo(10, headY - 40); c.lineTo(18, headY - 24);
        c.fill();

        // Eyes
        c.fillStyle = this.altEgo ? '#f43f5e' : (isHurt ? '#ef4444' : '#fef08a');
        c.fillRect(6, headY - 8, 8, 5);
        c.fillRect(-14, headY - 8, 8, 5);

        // Arms & Claws
        c.fillStyle = '#b45309';
        if (isPunch) {
          c.fillRect(5, torsoY + 6, 55, 16);
          c.fillStyle = '#facc15';
          c.fillRect(56, torsoY + 3, 15, 22);
        } else {
          c.fillRect(14, torsoY + 8, 16, 26);
          c.fillRect(-28, torsoY + 8, 16, 26);
        }
      }

      renderCharlomanti(c) {
        const isPunch = this.state === 'punch';
        const isKick = this.state === 'kick';
        const isCrouch = this.state === 'crouch';
        const isHurt = this.state === 'hurt';

        const headY = isCrouch ? -48 : -92;
        const torsoY = isCrouch ? -20 : -52;

        // Tail
        c.strokeStyle = '#d97706';
        c.lineWidth = 6;
        c.beginPath();
        c.moveTo(-18, torsoY + 30);
        c.quadraticCurveTo(-45, torsoY + 15, -40, torsoY - 10);
        c.stroke();

        // Legs / Law Doc Sweep
        c.fillStyle = '#065f46';
        if (isKick) {
          c.fillStyle = '#047857';
          c.fillRect(-15, -20, 18, 20);
          c.fillStyle = '#10b981';
          c.fillRect(0, -14, 75, 16);
          c.fillStyle = '#34d399';
          c.beginPath();
          c.moveTo(75, -14); c.lineTo(85, -6); c.lineTo(75, 2); c.fill();
        } else {
          c.fillRect(-18, isCrouch ? -24 : -35, 16, isCrouch ? 24 : 35);
          c.fillRect(4, isCrouch ? -24 : -35, 16, isCrouch ? 24 : 35);
        }

        // Torso & spots
        c.fillStyle = '#047857';
        c.fillRect(-20, torsoY, 40, 40);
        c.fillStyle = '#0f172a';
        c.beginPath();
        c.arc(-8, torsoY + 10, 3.5, 0, Math.PI * 2);
        c.arc(8, torsoY + 18, 4, 0, Math.PI * 2);
        c.fill();

        // Hair & Ears
        c.fillStyle = '#0f172a';
        c.beginPath();
        c.arc(0, headY, 28, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = '#d97706';
        c.beginPath();
        c.moveTo(-16, headY - 18); c.lineTo(-24, headY - 36); c.lineTo(-6, headY - 22); c.fill();
        c.beginPath();
        c.moveTo(16, headY - 18); c.lineTo(24, headY - 36); c.lineTo(6, headY - 22); c.fill();

        // Face & Eyes
        c.fillStyle = '#fbbf24';
        c.beginPath();
        c.arc(0, headY, 21, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = isHurt ? '#ef4444' : '#34d399';
        c.fillRect(-11, headY - 6, 7, 5);
        c.fillRect(4, headY - 6, 7, 5);

        // Arms
        c.fillStyle = '#065f46';
        if (isPunch) {
          c.fillRect(5, torsoY + 6, 52, 14);
          c.fillStyle = '#34d399';
          c.fillRect(54, torsoY + 2, 14, 20);
        } else {
          c.fillRect(12, torsoY + 6, 14, 24);
          c.fillRect(-24, torsoY + 6, 14, 24);
        }
      }
    }

    // =====================================
    // 3. GAME STATE & MATCH MANAGEMENT
    // =====================================
    const p1 = new Fighter('p1', 'Sbe3', 250, 445, 1, '#f59e0b');
    const p2 = new Fighter('p2', 'Charlomanti', 710, 445, -1, '#10b981');

    const game = {
      status: 'intro', // intro, fighting, finish_him, fatality, round_over, match_over
      round: 1,
      timer: 99,
      timerId: null,
      cpu: true
    };

    function toggleAI() {
      game.cpu = !game.cpu;
      document.getElementById('aiText').textContent = game.cpu ? 'ON' : 'OFF (2P)';
      document.getElementById('aiText').className = game.cpu ? 'text-green-400' : 'text-amber-400';
    }

    function doAction(fighterId, act) {
      initAudio();
      const att = fighterId === 'p1' ? p1 : p2;
      const def = fighterId === 'p1' ? p2 : p1;

      if (att.state === 'dead') return;
      if (game.status !== 'fighting' && game.status !== 'finish_him') return;

      if (act === 'punch') {
        att.state = 'punch'; att.stateTimer = 14; playPunchSFX();
        if (Math.abs(att.x - def.x) < 110) dealHit(att, def, 10, 'PUNCH', '#f59e0b');
      }
      else if (act === 'kick') {
        att.state = 'kick'; att.stateTimer = 18;
        if (att.id === 'p2') {
          // Charlomanti Law Doc Hits (3x low sweep)
          playLawDocSFX();
          if (Math.abs(att.x - def.x) < 125) {
            dealHit(att, def, 8, 'LAW DOC', '#14b8a6');
            setTimeout(() => { if (def.hp > 0) dealHit(att, def, 8, 'LAW DOC', '#14b8a6'); }, 90);
            setTimeout(() => {
              if (def.hp > 0) {
                dealHit(att, def, 10, 'LAW DOC CRIT!', '#2dd4bf');
                def.vy = -6; def.vx = att.facing * 8;
                triggerShake();
              }
            }, 180);
          }
        } else {
          playPunchSFX();
          if (Math.abs(att.x - def.x) < 115) dealHit(att, def, 14, 'LION KICK', '#f59e0b');
        }
      }
      else if (act === 'alt_ego' && att.id === 'p1') {
        if (!att.altEgo) {
          att.altEgo = true; att.altEgoTimer = 350;
          playSynthGong(120, 0.6); speakAnnouncer('Alt Ego!');
          document.getElementById('sbe3AltTag').classList.remove('hidden');
          floatText(att.x, att.y - 80, 'ALT EGO +60% ATK!', '#c084fc');
          triggerShake();
        }
      }
      else if (act === 'camo' && att.id === 'p2') {
        if (!att.camo) {
          att.camo = true; att.camoTimer = 300;
          playSynthGong(180, 0.5);
          document.getElementById('charCamoTag').classList.remove('hidden');
          floatText(att.x, att.y - 80, 'SHADOW CAMO', '#34d399');
        }
      }
      else if (act === 'ult') {
        if (att.superGauge < 100) return;
        att.superGauge = 0; att.state = 'ult'; att.stateTimer = 45;
        playCrunchSFX();
        triggerShake();

        if (att.id === 'p1') {
          speakAnnouncer('Charisma Ultimate!');
          showNotice('CHARISMA ULT!', 'BOW TO THE SULTAN!', '#eab308');
          setTimeout(() => {
            if (Math.abs(att.x - def.x) < 360) {
              dealHit(att, def, 38, 'CHARISMA CRIT!', '#facc15');
              spawnBlood(def.x, def.y - 60, 40);
              def.vy = -12; def.vx = att.facing * 12;
            }
          }, 350);
        } else {
          speakAnnouncer('Apex Predator!');
          showNotice('APEX JAGUAR!', 'SHADOWS OF THE JUNGLE!', '#10b981');
          setTimeout(() => {
            if (Math.abs(att.x - def.x) < 360) {
              dealHit(att, def, 40, 'APEX SHRED!', '#34d399');
              spawnBlood(def.x, def.y - 60, 45);
              def.vy = -12; def.vx = att.facing * 12;
            }
          }, 350);
        }
      }
    }

    function dealHit(att, def, base, label, color) {
      if (def.state === 'dead') return;
      let dmg = base;
      if (att.altEgo) dmg = Math.floor(dmg * 1.6);
      if (def.camo) {
        dmg = Math.floor(dmg * 0.4);
        def.camo = false;
        document.getElementById('charCamoTag').classList.add('hidden');
      }

      def.hp = Math.max(0, def.hp - dmg);
      def.state = 'hurt'; def.stateTimer = 16; def.vx = att.facing * 4;

      att.superGauge = Math.min(100, att.superGauge + 15);
      def.superGauge = Math.min(100, def.superGauge + 10);

      spawnBlood(def.x, def.y - 50, 15);
      playPunchSFX();
      triggerShake();
      floatText(def.x, def.y - 70, `-${dmg} ${label}`, color);
      updateHUD();

      if (def.hp <= 0) handleKnockout(def, att);
    }

    function handleKnockout(loser, winner) {
      clearInterval(game.timerId);
      loser.state = 'dead'; loser.vx = 0;

      if (winner.roundWins === 1) {
        // Final round -> FINISH HIM!
        game.status = 'finish_him';
        const pro = loser.id === 'p1' ? 'HIM' : 'HER';
        showNotice(`FINISH ${pro}!`, 'CHOOSE YOUR FATALITY', '#dc2626');
        speakAnnouncer(`Finish ${pro.toLowerCase()}!`);
        document.getElementById('fatalityBar').classList.remove('hidden');

        setTimeout(() => {
          if (game.status === 'finish_him') {
            document.getElementById('fatalityBar').classList.add('hidden');
            awardRound(winner);
          }
        }, 5500);
      } else {
        awardRound(winner);
      }
    }

    function executeFatality(type) {
      document.getElementById('fatalityBar').classList.add('hidden');
      game.status = 'fatality';
      triggerShake();
      const winner = type === 'sbe3' ? p1 : p2;
      const loser = type === 'sbe3' ? p2 : p1;

      for (let i = 0; i < 60; i++) {
        setTimeout(() => {
          spawnBlood(loser.x + (Math.random() - 0.5) * 40, loser.y - 60, 20);
          playCrunchSFX();
        }, i * 35);
      }

      showNotice('FATALITY!', `${winner.name.toUpperCase()} WINS!`, '#dc2626');
      speakAnnouncer('Fatality! ' + winner.name + ' wins!');

      setTimeout(() => finishMatch(winner), 3000);
    }

    function awardRound(winner) {
      game.status = 'round_over';
      winner.roundWins++;
      updateRoundDots();

      if (winner.roundWins >= 2) {
        finishMatch(winner);
      } else {
        showNotice(`${winner.name.toUpperCase()} WINS ROUND!`, '', winner.color);
        speakAnnouncer(`${winner.name} takes the round!`);
        setTimeout(() => nextRound(), 2500);
      }
    }

    function finishMatch(winner) {
      game.status = 'match_over';
      showNotice('CHAMPION', `${winner.name.toUpperCase()} RULES THE REALM`, winner.color);
      document.getElementById('rematchBtn').classList.remove('hidden');
    }

    function nextRound() {
      game.round++;
      document.getElementById('hudRound').textContent = `ROUND ${game.round}`;
      resetPositions();
      startCountdown();
    }

    function resetPositions() {
      p1.x = 250; p1.y = 445; p1.hp = 100; p1.state = 'idle'; p1.altEgo = false;
      p2.x = 710; p2.y = 445; p2.hp = 100; p2.state = 'idle'; p2.camo = false;
      updateHUD();
    }

    function resetMatch(full = false) {
      if (full) {
        p1.roundWins = 0; p2.roundWins = 0;
        game.round = 1;
        document.getElementById('hudRound').textContent = 'ROUND 1';
        updateRoundDots();
      }
      document.getElementById('rematchBtn').classList.add('hidden');
      document.getElementById('fatalityBar').classList.add('hidden');
      resetPositions();
      startCountdown();
    }

    function updateRoundDots() {
      const d1 = document.getElementById('p1Dots').children;
      const d2 = document.getElementById('p2Dots').children;
      for (let i = 0; i < 2; i++) {
        d1[i].className = i < p1.roundWins ? 'w-2.5 h-2.5 rounded-full bg-amber-500 shadow-[0_0_8px_#f59e0b]' : 'w-2.5 h-2.5 rounded-full border border-amber-500 bg-slate-900';
        d2[i].className = i < p2.roundWins ? 'w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'w-2.5 h-2.5 rounded-full border border-emerald-500 bg-slate-900';
      }
    }

    function startCountdown() {
      game.status = 'intro';
      game.timer = 99;
      document.getElementById('hudTimer').textContent = '99';

      showNotice(`ROUND ${game.round}`, '', '#ef4444');
      speakAnnouncer(`Round ${game.round}`);

      setTimeout(() => {
        showNotice('FIGHT!', '', '#eab308');
        speakAnnouncer('Fight!');
        game.status = 'fighting';
        hideNotice(800);

        if (game.timerId) clearInterval(game.timerId);
        game.timerId = setInterval(() => {
          if (game.status === 'fighting') {
            game.timer--;
            document.getElementById('hudTimer').textContent = game.timer;
            if (game.timer <= 0) {
              clearInterval(game.timerId);
              awardRound(p1.hp >= p2.hp ? p1 : p2);
            }
          }
        }, 1000);
      }, 1400);
    }

    function showNotice(main, sub, color = '#ef4444') {
      const m = document.getElementById('announcementMain');
      const s = document.getElementById('announcementSub');
      m.textContent = main;
      m.style.color = color;
      m.className = 'mk-font text-4xl sm:text-7xl font-black tracking-widest uppercase scale-110 transition-transform duration-200 text-center drop-shadow-[0_10px_35px_rgba(0,0,0,0.95)]';
      if (sub) { s.textContent = sub; s.style.opacity = '1'; } else { s.style.opacity = '0'; }
    }

    function hideNotice(delay = 500) {
      setTimeout(() => {
        document.getElementById('announcementMain').className = 'mk-font text-4xl sm:text-7xl font-black tracking-widest text-transparent uppercase scale-0 transition-transform duration-200 text-center';
        document.getElementById('announcementSub').style.opacity = '0';
      }, delay);
    }

    function floatText(x, y, txt, col) {
      const layer = document.getElementById('damageLayer');
      const el = document.createElement('div');
      el.className = 'absolute text-base sm:text-xl font-black floating-text arcade-font';
      el.style.color = col;
      el.style.left = `${(x / 960) * 100}%`;
      el.style.top = `${(y / 540) * 100}%`;
      el.textContent = txt;
      layer.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function triggerShake() {
      const w = document.getElementById('arcadeWrapper');
      w.classList.remove('shake');
      void w.offsetWidth;
      w.classList.add('shake');
      setTimeout(() => w.classList.remove('shake'), 250);
    }

    function updateHUD() {
      const p1p = Math.max(0, p1.hp);
      document.getElementById('p1Bar').style.width = `${p1p}%`;
      setTimeout(() => { document.getElementById('p1Backdrop').style.width = `${p1p}%`; }, 200);
      document.getElementById('p1SuperBar').style.width = `${p1.superGauge}%`;
      document.getElementById('p1SuperText').textContent = `${p1.superGauge}%`;
      document.getElementById('p1UltBtn').disabled = p1.superGauge < 100;

      const p2p = Math.max(0, p2.hp);
      document.getElementById('p2Bar').style.width = `${p2p}%`;
      setTimeout(() => { document.getElementById('p2Backdrop').style.width = `${p2p}%`; }, 200);
      document.getElementById('p2SuperBar').style.width = `${p2.superGauge}%`;
      document.getElementById('p2SuperText').textContent = `${p2.superGauge}%`;
      document.getElementById('p2UltBtn').disabled = p2.superGauge < 100;
    }

    // Keyboard bindings
    window.addEventListener('keydown', (e) => {
      initAudio();
      const k = e.key.toLowerCase();
      if (k === ' ' || k === 'enter') {
        if (game.status === 'match_over') resetMatch(true);
      }
      if (game.status !== 'fighting') return;

      if (k === 'w' && p1.isGrounded) { p1.vy = -18; p1.state = 'jump'; }
      if (k === 's') p1.state = 'crouch';
      if (k === 'a') { p1.vx = -5; p1.state = 'walk'; }
      if (k === 'd') { p1.vx = 5; p1.state = 'walk'; }
      if (k === 'j') doAction('p1', 'punch');
      if (k === 'k') doAction('p1', 'kick');
      if (k === 'u') doAction('p1', 'alt_ego');
      if (k === 'i') doAction('p1', 'ult');

      if (!game.cpu) {
        if (k === 'arrowup' && p2.isGrounded) { p2.vy = -18; p2.state = 'jump'; }
        if (k === 'arrowdown') p2.state = 'crouch';
        if (k === 'arrowleft') { p2.vx = -5; p2.state = 'walk'; }
        if (k === 'arrowright') { p2.vx = 5; p2.state = 'walk'; }
        if (k === '4') doAction('p2', 'punch');
        if (k === '5') doAction('p2', 'kick');
        if (k === '1') doAction('p2', 'camo');
        if (k === '2') doAction('p2', 'ult');
      }
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'a' || k === 'd') { if (p1.state === 'walk') p1.state = 'idle'; p1.vx = 0; }
      if (k === 's') { if (p1.state === 'crouch') p1.state = 'idle'; }
      if (k === 'arrowleft' || k === 'arrowright') { if (p2.state === 'walk') p2.state = 'idle'; p2.vx = 0; }
      if (k === 'arrowdown') { if (p2.state === 'crouch') p2.state = 'idle'; }
    });

    // AI Routine
    let aiClock = 0;
    function runAI() {
      if (!game.cpu || game.status !== 'fighting') return;
      aiClock++;
      if (aiClock % 16 !== 0) return;

      const d = Math.abs(p2.x - p1.x);
      if (p2.superGauge >= 100 && Math.random() < 0.8) {
        doAction('p2', 'ult');
      } else if (!p2.camo && Math.random() < 0.25) {
        doAction('p2', 'camo');
      } else if (d < 120) {
        if (Math.random() < 0.65) doAction('p2', 'kick');
        else doAction('p2', 'punch');
      } else {
        p2.vx = p2.x > p1.x ? -4.5 : 4.5;
        p2.state = 'walk';
        if (Math.random() < 0.2 && p2.isGrounded) { p2.vy = -16; p2.state = 'jump'; }
      }
    }

    // Canvas Background
    function renderBackground(c) {
      const sky = c.createLinearGradient(0, 0, 0, 445);
      sky.addColorStop(0, '#020617'); sky.addColorStop(0.5, '#1e1b4b'); sky.addColorStop(1, '#450a0a');
      c.fillStyle = sky; c.fillRect(0, 0, 960, 540);

      // Blood Moon
      c.save();
      c.fillStyle = '#dc2626'; c.shadowColor = '#ef4444'; c.shadowBlur = 45;
      c.beginPath(); c.arc(480, 110, 52, 0, Math.PI * 2); c.fill();
      c.restore();

      // Pillars
      c.fillStyle = '#0f172a';
      [-20, 210, 710, 920].forEach((px) => {
        c.fillRect(px, 120, 55, 325);
        c.fillRect(px - 6, 112, 67, 14);
        c.fillRect(px - 5, 430, 65, 18);
      });

      // Torches
      [237, 737].forEach((tx) => {
        c.save();
        c.fillStyle = Math.random() > 0.5 ? '#f59e0b' : '#ef4444';
        c.shadowColor = '#f59e0b'; c.shadowBlur = 25;
        c.beginPath(); c.arc(tx, 220, 8 + Math.sin(Date.now() * 0.01) * 3, 0, Math.PI * 2); c.fill();
        c.restore();
      });

      // Floor
      const flr = c.createLinearGradient(0, 445, 0, 540);
      flr.addColorStop(0, '#1c1917'); flr.addColorStop(0.3, '#292524'); flr.addColorStop(1, '#09090b');
      c.fillStyle = flr; c.fillRect(0, 445, 960, 95);

      c.strokeStyle = '#44403c'; c.lineWidth = 1.5;
      for (let x = 0; x < 960; x += 60) {
        c.beginPath(); c.moveTo(x, 445); c.lineTo(x - 30, 540); c.stroke();
      }
    }

    // 60 FPS Loop
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      renderBackground(ctx);

      runAI();

      p1.update(p2);
      p2.update(p1);

      p1.draw(ctx);
      p2.draw(ctx);

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(loop);
    }

    resetMatch(true);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
